<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/travel-theme.css">
</head>
<body class="auth-body">
<div class="auth-split">
    <aside th:replace="~{fragments :: authVisual('Locked out? It happens.', 'Tell us your email and we will send a link to set a new password.')}"></aside>
    <main class="auth-panel">
        <div class="auth-form sl-animate">
            <h1>Forgot your password?</h1>
            <p class="sub">Enter your account email and we'll send you a reset link.</p>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <form th:unless="${success}" method="post" action="/forgot-password">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-4">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
                </div>
                <button class="btn btn-navy btn-lg w-100" type="submit">Send reset link</button>
            </form>
            <p class="auth-alt"><a href="/login">Back to sign in</a></p>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
