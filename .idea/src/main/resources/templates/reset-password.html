<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/travel-theme.css">
</head>
<body class="auth-body">
<div class="auth-split">
    <aside th:replace="~{fragments :: authVisual('A fresh start.', 'Choose a new password and you are ready to fly again.')}"></aside>
    <main class="auth-panel">
        <div class="auth-form sl-animate">
            <h1>Choose a new password</h1>
            <p class="sub">Use at least 6 characters.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:if="${token}" method="post" action="/reset-password">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New password</label>
                    <input id="newPassword" name="newPassword" type="password" class="form-control" required minlength="6" autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="6" autocomplete="new-password">
                </div>
                <button class="btn btn-navy btn-lg w-100" type="submit">Reset password</button>
            </form>

            <p th:unless="${token}" class="auth-alt mt-0"><a href="/forgot-password">Request a new reset link</a></p>
            <p class="auth-alt"><a href="/login">Back to sign in</a></p>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
