<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refund Requests · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/staff-theme.css">
</head>
<body class="antialiased">
<div class="page">
<nav th:replace="~{fragments :: navStaff}"></nav>
<div class="page-wrapper">
    <div th:replace="~{fragments :: staffHeader('Finance', 'Refund requests', 'Customer-submitted disputes or exception requests awaiting review.')}"></div>
    <div class="page-body">
        <div class="container-xl">
            <div class="card">
                <div class="card-header"><h3 class="card-title">Pending requests</h3></div>
                <div class="table-responsive">
                    <table class="table table-vcenter card-table">
                        <thead>
                        <tr>
                            <th>Booking</th>
                            <th>Customer</th>
                            <th>Reason</th>
                            <th>Requested</th>
                            <th>Decision</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rr : ${pending}">
                            <td data-label="Booking"><a th:href="@{'/booking/'+${rr.booking.reference}}" th:text="${rr.booking.reference}"></a></td>
                            <td data-label="Customer" th:text="${rr.customer.name}"></td>
                            <td data-label="Reason" th:text="${rr.reason}"></td>
                            <td data-label="Requested" th:text="${rr.createdAt}"></td>
                            <td data-label="Decision">
                                <form method="post" th:action="@{'/finance/refund-requests/'+${rr.id}+'/approve'}" class="d-flex gap-2 mb-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="text" name="note" class="form-control form-control-sm" placeholder="Note (optional)" style="width:140px">
                                    <button class="btn btn-sm btn-primary">Approve refund</button>
                                </form>
                                <form method="post" th:action="@{'/finance/refund-requests/'+${rr.id}+'/reject'}" class="d-flex gap-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <input type="text" name="note" class="form-control form-control-sm" placeholder="Reason for rejection" style="width:140px">
                                    <button class="btn btn-sm btn-outline-danger">Reject</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pending)}"><td colspan="5" class="text-center text-muted py-4">No pending refund requests.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
