<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:data-bs-theme="${isStaff} ? 'dark'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notifications · SkyLanka Air</title>
    <link th:unless="${isStaff}" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link th:if="${isStaff}" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:unless="${isStaff}" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:unless="${isStaff}" rel="stylesheet" href="/css/travel-theme.css">
    <link th:if="${isStaff}" rel="stylesheet" href="/css/staff-theme.css">
</head>
<body>
<div th:class="${isStaff} ? 'page'">
<nav th:replace="${isStaff} ? ~{fragments :: navStaff} : ~{fragments :: navCustomer}"></nav>
<div th:class="${isStaff} ? 'page-wrapper'">

<th:block th:if="${isStaff}"><div th:replace="~{fragments :: staffHeader('Account', 'Notifications', 'Newest first. Click a notification to mark it read.')}"></div></th:block>
<div class="page-title-band" th:unless="${isStaff}">
    <div class="container">
        <h1>Notifications</h1>
        <p>Newest first. Click a notification to mark it read.</p>
    </div>
</div>

<main th:class="${isStaff} ? 'page-body container-xl' : 'container pb-5'">

    <div th:if="${#lists.isEmpty(notifications)}" class="card border-0 shadow-sm text-center py-5">
        <div class="fs-1 mb-2">🔔</div>
        <p class="text-muted mb-0">No notifications yet.</p>
    </div>

    <div th:each="n : ${notifications}"
         th:class="${'card border-0 shadow-sm mb-3 p-3 d-flex flex-row justify-content-between align-items-center sl-animate' + (n.read ? '' : ' border-start border-primary border-4')}">
        <div>
            <strong th:text="${n.title}">Notification</strong>
            <p class="text-muted mb-1" th:text="${n.message}">Message</p>
            <p class="text-muted small mb-0" th:text="${n.createdAt}">2026-01-01T00:00</p>
        </div>
        <form th:if="${!n.read}" method="post" th:action="@{'/notifications/' + ${n.id} + '/read'}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-primary btn-sm" type="submit">Mark as read</button>
        </form>
    </div>

</main>
</div>
</div>
<th:block th:unless="${isStaff}"><footer th:replace="~{fragments :: footerCustomer}"></footer></th:block>
<script th:unless="${isStaff}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${isStaff}" src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
