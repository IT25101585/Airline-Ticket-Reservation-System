<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/staff-theme.css">
</head>
<body class="antialiased">
<div class="page">
<nav th:replace="~{fragments :: navStaff}"></nav>
<div class="page-wrapper">
    <div th:replace="~{fragments :: staffHeader('Administration', 'Audit log', 'Everything recorded by the system, newest first.')}"></div>
    <div class="page-body">
        <div class="container-xl">
            <div class="mb-3"><a href="/admin" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to administration</a></div>

            <div class="card">
                <div class="card-header"><h3 class="card-title">Audit log</h3>
                    <div class="card-subtitle ms-auto text-muted"><span th:text="${flaggedCount}">0</span> flagged unusual-activity alert(s)</div></div>
                <div class="table-responsive">
                    <table class="table table-vcenter card-table">
                        <thead><tr><th>When</th><th>User</th><th>Action</th><th>Target</th><th>Details</th></tr></thead>
                        <tbody>
                        <th:block th:replace="~{fragments :: adminAuditRows(${logs}, ${userNamesById})}"></th:block>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer d-flex align-items-center">
                    <span class="text-muted">
                        <span th:text="${totalLogs}">0</span> entries &middot; page <span th:text="${page + 1}">1</span> of <span th:text="${totalPages}">1</span>
                    </span>
                    <div class="ms-auto d-flex gap-2">
                        <a th:if="${page > 0}" th:href="@{/admin/audit(page=${page - 1})}" class="btn btn-sm btn-outline-secondary">&laquo; Newer</a>
                        <a th:if="${page + 1 < totalPages}" th:href="@{/admin/audit(page=${page + 1})}" class="btn btn-sm btn-outline-secondary">Older &raquo;</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
