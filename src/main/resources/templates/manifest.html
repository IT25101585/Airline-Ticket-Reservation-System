<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manifest · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/staff-theme.css">
</head>
<body class="antialiased">
<div class="page">
<nav th:replace="~{fragments :: navStaff}"></nav>
<div class="page-wrapper">
    <div th:replace="~{fragments :: staffHeader('Operations', 'Manifest — '+${flight.flightNumber}, ${flight.origin+' → '+flight.destination+' · '+flight.departureDate+' '+flight.departureTime})}"></div>
    <div class="page-body">
        <div class="container-xl">
            <div class="card">
                <div class="card-header"><h3 class="card-title">Passengers</h3></div>
                <div class="table-responsive">
                    <table class="table table-vcenter card-table">
                        <thead>
                        <tr>
                            <th>Seat</th>
                            <th>Class</th>
                            <th>Passenger</th>
                            <th>Passport</th>
                            <th>Ticket</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${manifest}">
                            <td data-label="Seat" th:text="${p.seat?.seatNumber}"></td>
                            <td data-label="Class" th:text="${p.seat?.seatClass}"></td>
                            <td data-label="Passenger" th:text="${p.name}"></td>
                            <td data-label="Passport" th:text="${#strings.isEmpty(p.passportNumber)} ? '—' : ${p.passportNumber}"></td>
                            <td data-label="Ticket">
                                <div th:if="${ticketMap.get(p.id) != null}">
                                    <span th:text="${ticketMap.get(p.id).ticketNumber}" class="small"></span><br>
                                    <span class="badge"
                                          th:classappend="${ticketMap.get(p.id).status.name() == 'ISSUED'} ? 'bg-green-lt' : 'bg-secondary-lt'"
                                          th:text="${ticketMap.get(p.id).status}"></span>
                                    <span th:if="${ticketMap.get(p.id).reissuedFrom != null}" class="small text-muted"
                                          th:text="' (reissue of '+${ticketMap.get(p.id).reissuedFrom.ticketNumber}+')'"></span>
                                </div>
                                <span th:if="${ticketMap.get(p.id) == null}" class="text-muted small">Not issued</span>
                            </td>
                            <td data-label="Status">
                                <span th:if="${checkinMap.get(p.id) == null}" class="badge bg-secondary-lt">Not checked in</span>
                                <span th:if="${checkinMap.get(p.id) != null and checkinMap.get(p.id).noShow}" class="badge bg-red-lt">No-show</span>
                                <span th:if="${checkinMap.get(p.id) != null and checkinMap.get(p.id).checkedIn}" class="badge bg-green-lt">Checked in</span>
                            </td>
                            <td data-label="Actions">
                                <a th:if="${checkinMap.get(p.id) != null and checkinMap.get(p.id).checkedIn}"
                                   th:href="@{'/checkin/passenger/'+${p.id}+'/boarding-pass'}" class="link-success">Reprint pass</a>
                                <div th:if="${ticketMap.get(p.id) != null and ticketMap.get(p.id).status.name() == 'ISSUED'}" class="d-flex gap-2 mt-1">
                                    <form method="post" th:action="@{'/operations/ticket/'+${ticketMap.get(p.id).ticketNumber}+'/reissue'}">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="ref" th:value="${p.booking.reference}">
                                        <button class="btn btn-sm btn-outline-primary">Reissue ticket</button>
                                    </form>
                                    <form method="post" th:action="@{'/operations/ticket/'+${ticketMap.get(p.id).ticketNumber}+'/void'}"
                                          onsubmit="return confirm('Void this ticket?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <input type="hidden" name="ref" th:value="${p.booking.reference}">
                                        <button class="btn btn-sm btn-outline-danger">Void ticket</button>
                                    </form>
                                </div>
                                <details class="mt-1">
                                    <summary class="text-primary" style="cursor:pointer">Reassign seat</summary>
                                    <form method="post" th:action="@{'/checkin/'+${p.booking.reference}+'/passenger/'+${p.id}+'/reassign-seat'}" class="d-flex gap-2 mt-2">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <select name="newSeatId" class="form-select form-select-sm" required>
                                            <option value="">Choose a seat</option>
                                            <option th:each="s : ${availableSeats}" th:value="${s.id}"
                                                    th:text="${s.seatNumber}+' ('+${s.seatClass}+')'"></option>
                                        </select>
                                        <button class="btn btn-sm btn-primary">Move</button>
                                    </form>
                                </details>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(manifest)}"><td colspan="7" class="text-center text-muted py-4">No active bookings for this flight.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
