<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/travel-theme.css">
</head>
<body class="auth-body">
<div class="auth-split">
    <aside th:replace="~{fragments :: authVisual('Fly beautifully, start smoothly.', 'Save your details, keep every booking in one place and get your e-tickets the moment you pay.')}"></aside>
    <main class="auth-panel">
        <div class="auth-form sl-animate">
            <h1>Create an account</h1>
            <p class="sub">Save your passenger profile for faster bookings.</p>

            <form method="post" action="/register" th:object="${user}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="name" class="form-label">Full name</label>
                    <input id="name" th:field="*{name}" class="form-control" autocomplete="name" required>
                    <small class="text-danger" th:errors="*{name}"></small>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" autocomplete="email" required>
                    <small class="text-danger" th:errors="*{email}"></small>
                </div>
                <div class="mb-3">
                    <label for="contactNumber" class="form-label">Contact number</label>
                    <input id="contactNumber" th:field="*{contactNumber}" class="form-control" autocomplete="tel" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" minlength="6" autocomplete="new-password" required>
                    <small class="text-danger" th:errors="*{password}"></small>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="marketingOptIn" name="marketingOptIn" value="true">
                    <label class="form-check-label small" for="marketingOptIn">Send me promotions and newsletters (optional)</label>
                </div>
                <button class="btn btn-navy btn-lg w-100" type="submit">Create account</button>
            </form>
            <p class="auth-alt">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
