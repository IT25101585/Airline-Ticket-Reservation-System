# ============================================================
# SkyLanka Air Travels – Ticket Management
# Application Configuration
# ============================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/

# --- DataSource (SQL Server) ---
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SkyLankaAirTicketDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=your_sa_password_here
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
app.jwt.secret=SkyLanka_Super_Secret_JWT_Key_Change_In_Production_2024!
app.jwt.expiration-ms=86400000

# --- Application ---
app.base-url=http://localhost:8080
app.ticket.qr-validate-url=${app.base-url}/api/tickets/validate/

# --- Logging ---
logging.level.com.skylanka=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} – %msg%n

# --- Springdoc / Swagger ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
