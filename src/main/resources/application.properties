spring.application.name=SkyLanka-Air
spring.profiles.default=local
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AirlineReservation;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=8080

# Authentication and notifications. SQL Server and the existing local clock behaviour are unchanged.
security.jwt.secret=${JWT_SECRET:}
security.jwt.ttl-minutes=${JWT_TTL_MINUTES:60}
payments.gateway=${PAYMENT_GATEWAY:mock}
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.from=${NOTIFICATIONS_EMAIL_FROM:no-reply@skylankaair.local}
# Configure spring.mail.* and set NOTIFICATIONS_EMAIL_ENABLED=true to send real email.

# Minutes a PENDING booking's seat hold is retained before automatic release
booking.hold-minutes=15

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
