# Test configuration — uses an in-memory H2 database so no SQL Server needed for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TestJwtSecret_Min32Chars_ForTestOnly!
app.jwt.expiration-ms=3600000
app.base-url=http://localhost:8080
app.ticket.qr-validate-url=${app.base-url}/api/tickets/validate/

logging.level.com.skylanka=WARN
logging.level.org.springframework.security=WARN
