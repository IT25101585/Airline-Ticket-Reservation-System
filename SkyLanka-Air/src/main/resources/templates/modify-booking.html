<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:data-bs-theme="${isStaff} ? 'dark'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modify Booking · SkyLanka Air</title>
    <link th:unless="${isStaff}" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link th:if="${isStaff}" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:unless="${isStaff}" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:unless="${isStaff}" rel="stylesheet" href="/css/travel-theme.css">
    <link th:if="${isStaff}" rel="stylesheet" href="/css/staff-theme.css">
</head>
<body>
<div th:class="${isStaff} ? 'page'">
<nav th:replace="${isStaff} ? ~{fragments :: navStaff} : ~{fragments :: navCustomer}"></nav>
<div th:class="${isStaff} ? 'page-wrapper'">

<th:block th:if="${isStaff}"><div th:replace="~{fragments :: staffHeader('Support', 'Modify booking '+${booking.reference}, 'Status: '+${booking.status})}"></div></th:block>
<div class="page-title-band" th:unless="${isStaff}">
    <div class="container">
        <span class="badge bg-light text-primary mb-2" th:text="${booking.status}">CONFIRMED</span>
        <h1>Modify booking</h1>
        <p>Booking reference: <strong th:text="${booking.reference}">SKY-12345678</strong></p>
    </div>
</div>

<main th:class="${isStaff} ? 'page-body container-xl' : 'container pb-5'">
    <div class="row g-4 sl-stagger">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 fw-bold">Trip details</h2>
                    <p class="mb-1"><strong th:text="${booking.flight.flightNumber}">SK101</strong></p>
                    <p th:text="${booking.flight.origin + ' → ' + booking.flight.destination}">Colombo → London</p>
                    <p class="text-muted" th:text="${booking.flight.departureDate + ' · ' + booking.flight.departureTime}">2026-10-01 · 10:30</p>
                    <p class="mb-1">Seat: <strong th:text="${booking.seat?.seatNumber}">12A</strong></p>
                    <p class="mb-0">Seat class: <strong th:text="${booking.seatClass}">ECONOMY</strong></p>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 fw-bold">Primary passenger</h2>

                    <div th:if="${error != null}" class="alert alert-danger">
                        <strong th:text="${error}">Something went wrong.</strong>
                    </div>

                    <form method="post" th:action="@{'/booking/' + ${booking.reference} + '/modify'}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label for="passengerName" class="form-label">Passenger name</label>
                            <input id="passengerName" type="text" name="passengerName" class="form-control"
                                   th:value="${booking.passengerName}" minlength="2" maxlength="100"
                                   title="2-100 letters, spaces, apostrophes or hyphens" required>
                        </div>
                        <div class="mb-3">
                            <label for="passportNumber" class="form-label">Passport number</label>
                            <input id="passportNumber" type="text" name="passportNumber" class="form-control"
                                   th:value="${booking.passportNumber}" pattern="[A-Za-z0-9]{6,9}" minlength="6" maxlength="9"
                                   title="6-9 letters or digits" required>
                        </div>
                        <div class="mb-4">
                            <label for="passengerContact" class="form-label">Passenger contact</label>
                            <input id="passengerContact" type="text" name="passengerContact" class="form-control"
                                   th:value="${booking.passengerContact}" pattern="\+?[0-9]{7,15}" minlength="7" maxlength="16"
                                   title="7-15 digits, optional leading +" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Save changes</button>
                            <a class="btn btn-outline-secondary" th:href="@{'/booking/' + ${booking.reference}}">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${booking.passengers != null and booking.passengers.size() > 1}" class="card border-0 shadow-sm mt-4">
        <div class="card-body">
            <h2 class="h5 fw-bold mb-3">Other passengers</h2>
            <div th:each="p, iter : ${booking.passengers}" th:if="${iter.index > 0}" class="border-top pt-3 mt-3">
                <form method="post" th:action="@{'/booking/' + ${booking.reference} + '/passenger/' + ${p.id} + '/modify'}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <p class="text-muted">Seat <strong th:text="${p.seat != null ? p.seat.seatNumber : '-'}">14C</strong></p>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label th:for="${'passengerName-'+p.id}" class="form-label">Passenger name</label>
                            <input type="text" th:id="${'passengerName-'+p.id}" name="passengerName" class="form-control" th:value="${p.name}"
                                   minlength="2" maxlength="100" title="2-100 letters, spaces, apostrophes or hyphens" required>
                        </div>
                        <div class="col-md-4">
                            <label th:for="${'passportNumber-'+p.id}" class="form-label">Passport number</label>
                            <input type="text" th:id="${'passportNumber-'+p.id}" name="passportNumber" class="form-control" th:value="${p.passportNumber}"
                                   pattern="[A-Za-z0-9]{6,9}" minlength="6" maxlength="9" title="6-9 letters or digits" required>
                        </div>
                        <div class="col-md-4">
                            <label th:for="${'passengerContact-'+p.id}" class="form-label">Passenger contact</label>
                            <input type="text" th:id="${'passengerContact-'+p.id}" name="passengerContact" class="form-control" th:value="${p.contact}"
                                   pattern="\+?[0-9]{7,15}" minlength="7" maxlength="16" title="7-15 digits, optional leading +" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm mt-3">Save changes</button>
                </form>
            </div>
        </div>
    </div>
</main>
</div>
</div>
<th:block th:unless="${isStaff}"><footer th:replace="~{fragments :: footerCustomer}"></footer></th:block>
<script th:unless="${isStaff}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:if="${isStaff}" src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
</body>
</html>
