<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · SkyLanka Air</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/travel-theme.css">
</head>
<body class="auth-body">
<div class="auth-split">
    <aside th:replace="~{fragments :: authVisual('Welcome back aboard.', 'Sign in to see your trips, manage bookings and pick up right where you left off.')}"></aside>
    <main class="auth-panel">
        <div class="auth-form sl-animate">
            <h1>Sign in</h1>
            <p class="sub">Manage your trips and tickets.</p>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${param.reset}" class="alert alert-success">Your password has been reset. Please sign in.</div>

            <form method="post" action="/login">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-2">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required>
                </div>
                <p class="text-end small mb-4"><a href="/forgot-password">Forgot your password?</a></p>
                <button class="btn btn-navy btn-lg w-100" type="submit">Sign in</button>
            </form>
            <p class="auth-alt">New here? <a href="/register">Create an account</a></p>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
